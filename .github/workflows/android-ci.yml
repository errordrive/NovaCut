name: NovaCut Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify NovaCut APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Core Test Suite (Standalone)
        run: |
          echo "=== Executing NovaCut Standalone Test Suite ==="
          bash scripts/build_and_test.sh

      - name: Run Android Unit Tests (Gradle)
        run: |
          echo "=== Executing Gradle Unit Tests ==="
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: |
          echo "=== Assembling NovaCut Debug APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Integrity
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was generated in app/build/outputs/apk/debug/"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Generated APK ($APK_PATH) is empty!"
            exit 1
          fi
          echo "SUCCESS: Found valid APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacut-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            tests/bin/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            app/build/reports/
            ~/.gradle/daemon/
          retention-days: 7
          if-no-files-found: ignore
